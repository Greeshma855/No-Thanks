<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Late CMP iframe fixture</title>
  </head>
  <body>
    <main><h1>Article page</h1></main>
    <script>
      const parameters = new URLSearchParams(location.search);
      const delay = Number(parameters.get('delay') || '500');
      const source = parameters.get('src');
      setTimeout(() => {
        const frame = document.createElement('iframe');
        frame.title = 'Consent manager';
        frame.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;z-index:9999';
        frame.src = source || '/iframe-consent';
        document.body.append(frame);
      }, delay);
    </script>
  </body>
</html>
